[project]
name = "payment-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.13,<2",
  "faststream[rabbit,cli]>=0.5,<1",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "aiosqlite>=0.20,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
